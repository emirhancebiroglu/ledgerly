spring:
  application:
    name: api
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ledgerly}
    username: ${POSTGRES_USER:ledgerly}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      # Above ledgerly.document.max-bytes on purpose, so the application's own 413 with a usable
      # message wins rather than the container rejecting first with a generic error.
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:12MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:12MB}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

ledgerly:
  auth:
    jwt-secret: ${JWT_SECRET}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:30}
  storage:
    # Deliberately outside any web-served directory; nothing serves static files from disk.
    root: ${STORAGE_ROOT:./var/storage}
  document:
    max-bytes: ${DOCUMENT_MAX_BYTES:10485760}
    reaper:
      # A document stuck in PROCESSING longer than this is presumed crashed, not just slow — the
      # ai-side timeout (below) already bounds a single call, so this only catches a crash between
      # markProcessing and the outcome write.
      stuck-after-seconds: ${DOCUMENT_REAPER_STUCK_AFTER_SECONDS:300}
      interval-seconds: ${DOCUMENT_REAPER_INTERVAL_SECONDS:60}
      # Caps one sweep's candidate SELECT — an outage can strand an unbounded number of documents
      # in PROCESSING, and this is not obligated to drain all of them in one cycle.
      batch-size: ${DOCUMENT_REAPER_BATCH_SIZE:500}
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8000}
    # Must clear ai's own LLM call timeout (120s, see apps/ai app/config.py) plus its retries —
    # a real vision model call saw p95 latency around 90s during the M5 gate run. Extraction now
    # runs off the request thread (T7), so this only bounds one async worker call, not an HTTP
    # request a user is waiting on.
    timeout-seconds: ${AI_TIMEOUT_SECONDS:150}
  extraction:
    # 1,000,000.00 in minor units. Above this a human signs off, however consistent the
    # extraction looked — a misplaced decimal is most dangerous when everything else adds up.
    amount-ceiling-minor: ${EXTRACTION_AMOUNT_CEILING_MINOR:100000000}
    max-age-years: ${EXTRACTION_MAX_AGE_YEARS:10}
    max-future-days: ${EXTRACTION_MAX_FUTURE_DAYS:1}
  categorization:
    # Below this, an expense routes to review instead of posting silently (M6 T7). Mirrors the
    # extraction self-check gate's 0.7 threshold in apps/ai/app/llm/extraction_graph.py.
    confidence-threshold: ${CATEGORIZATION_CONFIDENCE_THRESHOLD:0.7}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId}] [%thread] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health
      cors:
        allowed-origins: http://localhost:3000
        allowed-methods: GET
  endpoint:
    health:
      show-details: never
