spring:
  application:
    name: api
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ledgerly}
    username: ${POSTGRES_USER:ledgerly}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      # Above ledgerly.document.max-bytes on purpose, so the application's own 413 with a usable
      # message wins rather than the container rejecting first with a generic error.
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:12MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:12MB}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

ledgerly:
  auth:
    jwt-secret: ${JWT_SECRET}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:30}
  cors:
    # Comma-separated. Defaults to local dev's web origin; a deployed environment overrides
    # this to the real web origin(s) — see CorsConfig.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  rate-limit:
    # Where the quota counter lives: "redis" (default) shares it across instances; "in-memory"
    # keeps it in the process, which enforces the identical limit only while exactly one instance
    # runs. Defaulting to redis means a multi-instance deployment cannot lose its shared counter
    # by omitting a setting — opting out has to be deliberate.
    backend: ${RATE_LIMIT_BACKEND:redis}
    auth:
      max-requests: ${AUTH_RATE_LIMIT_MAX_REQUESTS:5}
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
  storage:
    # Deliberately outside any web-served directory; nothing serves static files from disk.
    # Only read on non-"prod" profiles (LocalDiskStorage's own @Profile), so it's harmless that
    # this key has no R2 equivalent below.
    root: ${STORAGE_ROOT:./var/storage}
    r2:
      # Only read on the "prod" profile (R2ClientConfig/R2StorageClient's own @Profile) — no
      # default, since a real value only exists once an R2 bucket has been provisioned.
      account-id: ${R2_ACCOUNT_ID:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket: ${R2_BUCKET:}
  document:
    max-bytes: ${DOCUMENT_MAX_BYTES:10485760}
    # Where SSE fan-out is coordinated: "redis" (default) reaches a subscriber on any instance;
    # "in-memory" only reaches one attached to the same process. Same asymmetry as
    # ledgerly.rate-limit.backend and the same reason it defaults to redis — a multi-instance
    # deployment that omits this loses cross-instance delivery silently, a single-instance one
    # that omits it just keeps a working Redis round trip.
    event-broker: ${DOCUMENT_EVENT_BROKER:redis}
    queue:
      # Upload persists PENDING work; a bounded poller later claims due rows atomically.
      interval-seconds: ${DOCUMENT_QUEUE_INTERVAL_SECONDS:5}
      batch-size: ${DOCUMENT_QUEUE_BATCH_SIZE:100}
      max-attempts: ${DOCUMENT_QUEUE_MAX_ATTEMPTS:5}
      retry-initial-seconds: ${DOCUMENT_QUEUE_RETRY_INITIAL_SECONDS:5}
      retry-max-seconds: ${DOCUMENT_QUEUE_RETRY_MAX_SECONDS:300}
      dispatch-retry-seconds: ${DOCUMENT_QUEUE_DISPATCH_RETRY_SECONDS:5}
    reaper:
      # A document stuck in PROCESSING longer than this is presumed crashed, not just slow — the
      # ai-side timeout (below) already bounds a single call, so this only catches a crash between
      # markProcessing and the outcome write.
      stuck-after-seconds: ${DOCUMENT_REAPER_STUCK_AFTER_SECONDS:300}
      interval-seconds: ${DOCUMENT_REAPER_INTERVAL_SECONDS:60}
      # Caps one sweep's candidate SELECT — an outage can strand an unbounded number of documents
      # in PROCESSING, and this is not obligated to drain all of them in one cycle.
      batch-size: ${DOCUMENT_REAPER_BATCH_SIZE:500}
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8000}
    service-token: ${AI_SERVICE_TOKEN}
    # Must clear ai's own LLM call timeout (120s, see apps/ai app/config.py) plus its retries —
    # a real vision model call saw p95 latency around 90s during the M5 gate run. Extraction now
    # runs off the request thread (T7), so this only bounds one async worker call, not an HTTP
    # request a user is waiting on.
    timeout-seconds: ${AI_TIMEOUT_SECONDS:150}
  extraction:
    # 1,000,000.00 in minor units. Above this a human signs off, however consistent the
    # extraction looked — a misplaced decimal is most dangerous when everything else adds up.
    amount-ceiling-minor: ${EXTRACTION_AMOUNT_CEILING_MINOR:100000000}
    max-age-years: ${EXTRACTION_MAX_AGE_YEARS:10}
    max-future-days: ${EXTRACTION_MAX_FUTURE_DAYS:1}
  categorization:
    # Below this, an expense routes to review instead of posting silently (M6 T7). Must match
    # docs/contracts/thresholds.json's confidenceThreshold, which also gates ai's extraction
    # self-check (apps/ai/app/llm/extraction_graph.py) -- ConfidenceThresholdContractTest fails
    # if this default drifts from the contract.
    confidence-threshold: ${CATEGORIZATION_CONFIDENCE_THRESHOLD:0.7}
  anomaly:
    # The request schema bounds one advisory payload to the newest 1,000 comparable postings;
    # the database predicate still restricts every sample to the preceding 90 days.
    history-limit: ${ANOMALY_HISTORY_LIMIT:1000}
logging:
  structured:
    format:
      console: logstash

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  # No request headers/IP/cookies — an exception's HTTP context can carry a bearer token or a
  # session cookie, and this is the same PII bar M9's structured-logging review already set.
  send-default-pii: false
  # This service never renders a UI; Sentry's session-replay/screenshot features don't apply.
  max-request-body-size: none

management:
  health:
    # Redis backs SSE fan-out and rate limiting, but an outage must not mark the system of record
    # dead: reads remain safe and cost-bearing writes fail closed in UploadRateLimiter.
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
      cors:
        allowed-origins: http://localhost:3000
        allowed-methods: GET
  endpoint:
    health:
      show-details: never
