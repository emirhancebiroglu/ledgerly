spring:
  datasource:
    hikari:
      # Each distinct Spring context in a `mvn verify` run opens its own pool (default max 10);
      # enough IT classes forcing distinct contexts exhausts Postgres's connection limit even
      # after raising it (see AbstractPostgresIT). A small per-context pool is enough for these
      # single-threaded MockMvc tests and keeps the aggregate well under any reasonable limit.
      maximum-pool-size: 4

ledgerly:
  auth:
    jwt-secret: test-only-secret-not-for-production-use-0123456789
  storage:
    root: ${java.io.tmpdir}/ledgerly-test-storage
  document:
    # Small on purpose: the over-cap test builds a buffer of this size, and 10MB per run is waste.
    max-bytes: 65536
  ai:
    # Tests replace the ExtractionClient bean; nothing should reach this address.
    base-url: http://localhost:59999
    timeout-seconds: 2
    service-token: test-service-token
