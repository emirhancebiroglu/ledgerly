name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  env-example:
    name: .env.example matches docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash scripts/check-env-example.sh

  api:
    name: api (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: forbid floating-point columns in migrations
        run: |
          if sed 's/--.*$//' src/main/resources/db/migration/*.sql \
              | grep -iE '\b(float[48]?|real|double\s+precision)\b'; then
            echo "::error::floating-point column type found in a Flyway migration — money must be BIGINT + CHAR(3)"
            exit 1
          fi
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      # `verify`, not `test`: Spring Boot's parent excludes **/*IT.java from surefire, so `test`
      # runs the unit tests and silently skips every integration test — the ledger-write,
      # tenant-isolation, idempotency and pipeline assertions among them. Those need Docker for
      # Testcontainers, which the runner provides.
      #
      # `clean` because a stale target/test-classes entry whose source no longer exists (after a
      # branch switch or a rename) makes failsafe try to load a class it cannot resolve, failing
      # with a message that names the class and not the cause. Harmless on a fresh CI checkout,
      # kept so this command means the same thing here as it does locally.
      - run: ./mvnw -B clean verify

  ai:
    name: ai (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.0"
      - run: pip install -r requirements-dev.txt
      - run: pytest

  web:
    name: web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  dependency-security:
    name: dependency security (high/critical)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      # Trivy resolves Maven transitive POMs while scanning. Warm the same runner-local
      # ~/.m2 cache first so the scan does not fan out against Maven Central and trigger a 429.
      - name: warm Maven dependency cache
        working-directory: apps/api
        run: ./mvnw -B -ntp dependency:resolve
      # Trivy reports the library, advisory, installed version and fixed version in its table.
      # There is deliberately no continue-on-error: database download/scan failures and the
      # job timeout must fail closed rather than turn a broken scan into a green check.
      - name: scan Maven, Python, and npm dependencies
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          vuln-type: library
          version: v0.72.0
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table
          timeout: 10m
          skip-dirs: .git,apps/api/target,apps/ai/.venv,apps/web/node_modules
        env:
          # All Maven POMs must be present locally before offline mode; otherwise Trivy would
          # silently omit unresolved transitive dependencies from the security result.
          TRIVY_OFFLINE_SCAN: "true"
      # T7: a separate step (not combined with the vuln scan above) — secret findings have
      # their own severity scale and skip-dirs needs, and mixing them into one report makes
      # either kind of finding easier to miss. Excludes invoices/ (real-samples/ is gitignored
      # personal financial documents; anything caught by mistake here isn't reachable to scan
      # anyway, this is belt-and-braces) and *.log (scratch output, gitignored, never meant to
      # be scanned as source).
      - name: scan for committed secrets
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          version: v0.72.0
          exit-code: '1'
          format: table
          timeout: 10m
          skip-dirs: .git,apps/api/target,apps/ai/.venv,apps/web/node_modules,invoices
        env:
          # `--scanners secret` still runs full Maven/pip/npm dependency analysis before
          # reporting only secret findings — this reuses the already-warmed ~/.m2 cache from
          # the vuln scan step above (same job) rather than re-triggering Maven Central and
          # hitting the same 429 that step's own warm-cache step exists to avoid.
          TRIVY_OFFLINE_SCAN: "true"
