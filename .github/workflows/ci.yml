name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: api (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - name: forbid floating-point columns in migrations
        run: |
          if sed 's/--.*$//' src/main/resources/db/migration/*.sql \
              | grep -iE '\b(float[48]?|real|double\s+precision)\b'; then
            echo "::error::floating-point column type found in a Flyway migration — money must be BIGINT + CHAR(3)"
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: ./mvnw -B test

  ai:
    name: ai (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.0"
      - run: pip install -r requirements-dev.txt
      - run: pytest

  web:
    name: web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
