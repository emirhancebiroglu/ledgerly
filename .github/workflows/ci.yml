name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: api (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: forbid floating-point columns in migrations
        run: |
          if sed 's/--.*$//' src/main/resources/db/migration/*.sql \
              | grep -iE '\b(float[48]?|real|double\s+precision)\b'; then
            echo "::error::floating-point column type found in a Flyway migration — money must be BIGINT + CHAR(3)"
            exit 1
          fi
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
      - run: ./mvnw -B test

  ai:
    name: ai (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.0"
      - run: pip install -r requirements-dev.txt
      - run: pytest

  web:
    name: web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  dependency-security:
    name: dependency security (high/critical)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Trivy reports the library, advisory, installed version and fixed version in its table.
      # There is deliberately no continue-on-error: database download/scan failures and the
      # job timeout must fail closed rather than turn a broken scan into a green check.
      - name: scan Maven, Python, and npm dependencies
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          vuln-type: library
          version: v0.72.0
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table
          timeout: 10m
          skip-dirs: .git,apps/api/target,apps/ai/.venv,apps/web/node_modules
