services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ledgerly}
      POSTGRES_USER: ${POSTGRES_USER:-ledgerly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ledgerly}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      SPRING_DATA_REDIS_HOST: redis

  ai:
    build:
      context: ../apps/ai
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${AI_PORT:-8000}:8000"
    environment:
      AI_LLM_PROVIDER: ${AI_LLM_PROVIDER:-litellm}
      AI_LLM_API_KEY: ${AI_LLM_API_KEY:?AI_LLM_API_KEY must be set}
    # AI_LLM_MODEL / AI_LLM_API_BASE / AI_LLM_SUPPORTS_NATIVE_PDF are deliberately not set here —
    # Settings' own defaults (app/config.py) are the single source of truth, so this file cannot
    # drift out of sync with them the way it did when the Q1 provider changed mid-milestone. To
    # override any of them for a deployment, add an env_file or pass -e on the CLI; do not hardcode
    # a duplicate default in this compose file again.

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}

volumes:
  postgres-data:
